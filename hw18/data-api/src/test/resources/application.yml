spring:
  flyway:
    enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

resilience4j.ratelimiter:
  instances:
    dataRateLimitedService:
      limit-for-period: 8
      limit-refresh-period: 1m
      timeout-duration: 0

